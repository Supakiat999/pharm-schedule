};

function t(){ return T[state.lang]; }
function applyTheme(){
  if(state.theme==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", state.theme);
}

function pd(str){ var p=str.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function fd(dt){
  var m=dt.getMonth()+1, d=dt.getDate();
  return dt.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(d<10?"0":"")+d;
}
function addDays(dt,n){ var x=new Date(dt.getTime()); x.setDate(x.getDate()+n); return x; }
function dayOfWeek(wi,di){ return addDays(pd(TERM_START), wi*7+di); }
function todayStr(){ return fd(new Date()); }
function diffDays(a,b){ return Math.round((pd(b)-pd(a))/86400000); }

function yearOf(dt){ return state.lang==="th" ? dt.getFullYear()+543 : dt.getFullYear(); }
function shortDate(dt){ return dt.getDate()+" "+t().mons[dt.getMonth()]; }
function weekRange(wi){
  var a=dayOfWeek(wi,0), b=dayOfWeek(wi,4);
  var left = a.getMonth()===b.getMonth() ? a.getDate() : shortDate(a);
  return left+" - "+shortDate(b)+" "+yearOf(b);
}
function weekOfDate(ds){
  var n=diffDays(TERM_START,ds);
  if(n<0) return -1;
  var w=Math.floor(n/7);
  return w>=WEEKS ? WEEKS : w;
}

/* visible under the current track */
function forTrack(s){ return s.t==="all" || s.t===state.track; }
function daySessions(ds){
  return SESSIONS.filter(function(s){ return s.d===ds && forTrack(s); })
                 .sort(function(a,b){ return a.s-b.s; });
}
function weekHasExam(wi){
  for(var i=0;i<5;i++){
    var ds=fd(dayOfWeek(wi,i));
    if(SESSIONS.some(function(s){ return s.d===ds && s.c==="EXAM" && forTrack(s); })) return true;
  }
  return false;
}
function weekIsEmpty(wi){
  for(var i=0;i<5;i++){ if(daySessions(fd(dayOfWeek(wi,i))).length) return false; }
  return true;
}

/* label pieces for one session */

  if(s.n) return state.lang==="en" ? (EN_LABEL[s.n]||s.n) : s.n;
  var c=COURSES[s.c];

}
function evMeta(s){
  var bits=[];
  if(s.r) bits.push((state.lang==="th"?"ห้อง ":"Rm ")+s.r);
  var c=COURSES[s.c];
  if(!c.useSess && s.q) bits.push(s.q);
  return bits.join(" · ");
}
function hh(n){ return (n<10?"0":"")+n+":00"; }
function esc(x){
  return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function countdown(ds){
  var n=diffDays(todayStr(),ds);
  if(n<0)  return {txt:t().passed,   cls:"past"};
  if(n===0)return {txt:t().isToday,  cls:"soon"};
  if(n===1)return {txt:t().tomorrow, cls:"soon"};
  return {txt:t().daysLeft.replace("%d",n), cls:n<=7?"soon":""};
}
var TRACKS = {
  sci:  {c:"--c-idqlab1", th:"เภสัชกรรมอุตสาหการ", en:"Pharm Sci"},
  care: {c:"--c-idq1lab", th:"บริบาลเภสัชกรรม",    en:"Pharm Care"}
};
function trackLabel(k){ return state.lang==="th" ? TRACKS[k].th : TRACKS[k].en; }

var THEME_ICON = {auto:"◐", light:"☀", dark:"☾"};
function renderThemeSeg(){
  var opts=["auto","light","dark"];
  var lab={auto:t().themeAuto, light:t().themeLight, dark:t().themeDark};
  return '<div class="seg" role="group" aria-label="'+esc(t().theme)+'">'
    + opts.map(function(k){
        return '<button data-theme-set="'+k+'" aria-pressed="'+(state.theme===k)+'" '
          +'title="'+esc(t().theme+": "+lab[k])+'"><span aria-hidden="true">'+THEME_ICON[k]+'</span>'
          +'<span class="sr">'+esc(lab[k])+'</span></button>';
      }).join("")
    +'</div>';
}

/* ── gate ─────────────────────────────────────────────────────────── */
function renderGate(){
  function card(k,th,en,note){
    return '<button class="track-card" data-track="'+k+'" style="--tc:var('+TRACKS[k].c+')">'
      +'<span class="tc-code mono">'+(k==="sci"?"PHARM SCI":"PHARM CARE")+'</span>'
      +'<span class="tc-th">'+esc(th)+'</span>'
      +'<span class="tc-en">'+esc(en)+'</span>'
      +'<span class="tc-note">'+esc(note)+'</span></button>';
  }
  return '<div class="gate">'
    +'<div>'
    +'<p class="gate-eyebrow">'+esc(t().eyebrow)+'</p>'
    +'<h1>'+esc(t().title)+'</h1>'
    +'<p class="lede">'+esc(t().lede)+'</p>'
    +'</div>'
    +'<div>'
    +'<p class="gate-eyebrow">'+esc(t().pick)+'</p>'
    +'<div class="gate-pick">'
    + card("sci",  t().sciTh,  t().sciEn,  t().sciNote)
    + card("care", t().careTh, t().careEn, t().careNote)
    +'</div></div>'
    +'<p class="gate-foot">'+esc(t().gateFoot)+'</p>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap">'
    +'<div class="seg" role="group">'
    +'<button data-lang="th" aria-pressed="'+(state.lang==="th")+'">ไทย</button>'
    +'<button data-lang="en" aria-pressed="'+(state.lang==="en")+'">EN</button>'
    +'</div>'
    + renderThemeSeg()
    +'</div></div>';
}

/* ── top bar ──────────────────────────────────────────────────────── */
function renderBar(){
  var wi=state.week, cur=weekOfDate(todayStr());
  var ruler="";
  for(var i=0;i<WEEKS;i++){
    var flag = weekHasExam(i) ? '<span class="flag"></span>' : "";
    ruler += '<button data-week="'+i+'" aria-current="'+(i===wi)+'"'
      + (weekIsEmpty(i)?' class="is-off"':"")
      + ' title="'+esc(t().week+" "+(i+1)+" · "+weekRange(i))+'">'+(i+1)+flag+'</button>';
  }
  return '<div class="bar">'
    +'<div class="bar-top">'
    +'<div class="brand"><b>'+esc(t().title)+'</b><span>'+esc(t().eyebrow)+'</span></div>'
    +'<button class="chip" id="btn-track" style="--tc:var('+TRACKS[state.track].c+')" '
    +'title="'+esc(t().changeTrack)+'"><span class="dot"></span>'+esc(trackLabel(state.track))+'</button>'
    + renderThemeSeg()
    +'<div class="seg" role="group">'
    +'<button data-lang="th" aria-pressed="'+(state.lang==="th")+'">ไทย</button>'
    +'<button data-lang="en" aria-pressed="'+(state.lang==="en")+'">EN</button>'
    +'</div></div>'
    +'<div class="weeknav">'
    +'<button class="navbtn" data-nav="-1" aria-label="'+esc(t().prev)+'"'+(wi===0?" disabled":"")+'>&#8249;</button>'
    +'<button class="navbtn" data-nav="1" aria-label="'+esc(t().next)+'"'+(wi===WEEKS-1?" disabled":"")+'>&#8250;</button>'
    +'<span class="wk-label" aria-live="polite"><b>'+esc(t().week+" "+(wi+1))+'</b>'
    +'<span class="mono">'+esc(weekRange(wi))+'</span></span>'
    + (cur>=0 && cur<WEEKS ? '<button class="today-btn" data-week="'+cur+'">'+esc(t().today)+'</button>' : "")
    +'</div>'
    +'<div class="ruler" role="group" aria-label="'+esc(t().week)+'">'+ruler+'</div>'
    +'</div>';
}

/* ── next-class strip ─────────────────────────────────────────────── */
function renderNext(){
  var now=new Date(), ts=todayStr();
  if(ts<TERM_START) return '<div class="next"><span class="nlab">'+esc(t().week+" 1")
    +'</span><span>'+esc(t().beforeTerm)+'</span></div>';
  var pool=SESSIONS.filter(forTrack).filter(function(s){
    return s.d>ts || (s.d===ts && s.e>now.getHours());
  }).sort(function(a,b){ return a.d<b.d?-1:a.d>b.d?1:a.s-b.s; });
  if(!pool.length) return '<div class="next"><span class="nlab">'+esc(t().exams)
    +'</span><span>'+esc(t().afterTerm)+'</span></div>';
  var s=pool[0], dt=pd(s.d);
  var when = s.d===ts ? t().isToday : shortDate(dt);
  return '<div class="next"><span class="nlab">'+esc(t().nextUp)+'</span>'
    +'<span><b>'+esc(COURSES[s.c].code)+'</b> · '+esc(evName(s))+'</span>'
    +'<span class="nwhen">'+esc(when+" "+hh(s.s))+'</span></div>';
}
/* ── desktop time grid (days as rows, hours as columns) ───────────── */
var HOURS=[8,9,10,11,12,13,14,15];
function col(h){ return h-6; }

function evBox(s){
  var c=COURSES[s.c], meta=evMeta(s);
  return '<div class="ev'+(c.isExam?" is-exam":"")+'" role="cell"'
    +' style="--c:var('+c.v+');grid-column:'+col(s.s)+'/'+col(s.e)+'">'
    +'<span class="ev-code">'+esc(c.code)+'</span>'
    +'<span class="ev-name">'+esc(evName(s))+'</span>'
    + (meta?'<span class="ev-meta">'+esc(meta)+'</span>':"")
    +'</div>';
}

function renderGrid(){
  var wi=state.week, ts=todayStr(), now=new Date();
  var head='<div class="grow ghead" role="row"><div class="daycell"></div>';
  for(var h=0;h<HOURS.length;h++){
    head+='<div class="hcell'+(HOURS[h]===12?" lunch":"")+'" role="columnheader">'
       +HOURS[h]+'-'+(HOURS[h]+1)+'</div>';
  }
  head+='</div>';

  var rows="";
  for(var i=0;i<5;i++){
    var dt=dayOfWeek(wi,i), ds=fd(dt), isT=(ds===ts);
    var body="";
    for(var k=0;k<HOURS.length;k++){
      body+='<div class="slot'+(HOURS[k]===12?" lunch":"")+'" aria-hidden="true" style="grid-column:'
         +col(HOURS[k])+'"></div>';
    }
    if(HOLIDAYS[ds]){
      body+='<div class="band" role="cell" style="--c:var(--c-off)">'
        +'<span class="b-code">'+esc(COURSES.OFF[state.lang])+'</span>'
        +'<span class="b-name">'+esc(HOLIDAYS[ds][state.lang])+'</span></div>';
    }else{
      var list=daySessions(ds);
      for(var j=0;j<list.length;j++) body+=evBox(list[j]);
      if(!list.length) body+='<div class="band" role="cell" style="--c:var(--c-off);opacity:.55">'
        +'<span class="b-name" style="color:var(--ink-3);font-weight:400">'+esc(t().noClass)+'</span></div>';
    }
    var nl="";
    if(isT && now.getHours()>=8 && now.getHours()<16){
      var frac=((now.getHours()-8)+now.getMinutes()/60)/8;
      nl='<div class="nowline" style="left:calc(var(--rail) + (100% - var(--rail)) * '
        +frac.toFixed(4)+')"></div>';
    }
    rows+='<div class="grow'+(isT?" is-today":"")+'" role="row">'
      +'<div class="daycell" role="rowheader"><span class="dname">'+esc(t().days[i])+'</span>'
      +'<span class="ddate">'+esc(shortDate(dt))+'</span></div>'
      +body+nl+'</div>';
  }
  return '<div class="grid" role="table" aria-label="'+esc(t().week+" "+(wi+1))+'">'+head+rows+'</div>';
}

/* ── mobile agenda ────────────────────────────────────────────────── */
function renderAgenda(){
  var wi=state.week, ts=todayStr(), out="";
  for(var i=0;i<5;i++){
    var dt=dayOfWeek(wi,i), ds=fd(dt), isT=(ds===ts), body="";
    if(HOLIDAYS[ds]){
      body='<div class="row" style="--c:var(--c-off)"><span class="rt mono"><i>--</i></span>'
        +'<span class="rb"><span class="rcode">'+esc(COURSES.OFF[state.lang])+'</span>'
        +'<span class="rname">'+esc(HOLIDAYS[ds][state.lang])+'</span></span></div>';
    }else{
      var list=daySessions(ds);
      if(!list.length){ body='<div class="empty">'+esc(t().noClass)+'</div>'; }
      else{
        for(var j=0;j<list.length;j++){
          var s=list[j], c=COURSES[s.c], meta=evMeta(s);
          body+='<div class="row'+(c.isExam?" is-exam":"")+'" style="--c:var('+c.v+')">'
            +'<span class="rt mono"><i>'+hh(s.s)+'</i><i>'+hh(s.e)+'</i></span>'
            +'<span class="rb"><span class="rcode">'+esc(c.code)+'</span>'
            +'<span class="rname">'+esc(evName(s))+'</span>'
            + (meta?'<span class="rmeta">'+esc(meta)+'</span>':"")
            +'</span></div>';
        }
      }
    }
    out+='<section class="day'+(isT?" is-today":"")+'">'
      +'<header class="day-h"><span class="dn">'+esc(t().days[i])+'</span>'
      + (isT?'<span class="tag">'+esc(t().today)+'</span>':"")
      +'<span class="dd">'+esc(shortDate(dt))+'</span></header>'
      +'<div class="rows">'+body+'</div></section>';
  }
  return '<div class="agenda">'+out+'</div>';
}
/* ── day-level warnings for cells that need checking ──────────────── */
function renderNotes(){
  var wi=state.week, out="";
  for(var i=0;i<5;i++){
    var ds=fd(dayOfWeek(wi,i));
    if(NOTES[ds]) out+='<div class="note"><b>'+esc(t().checkLab)+'</b><span>'
      +esc(shortDate(pd(ds)))+' — '+esc(NOTES[ds][state.lang])+'</span></div>';
  }
  return out;
}

/* ── exam panel ───────────────────────────────────────────────────── */
function renderExams(){
  var list=SESSIONS.filter(function(s){ return s.c==="EXAM" && forTrack(s); })
                   .sort(function(a,b){ return a.d<b.d?-1:a.d>b.d?1:a.s-b.s; });
  var upcoming=list.filter(function(s){ return diffDays(todayStr(),s.d)>=0; });
  var rows=list.map(function(s){
    var cd=countdown(s.d), dt=pd(s.d);
    return '<div class="exam '+cd.cls+'" style="--c:var(--c-exam)">'
      +'<span class="xd mono">'+esc(shortDate(dt))+'</span>'
      +'<span class="xn">'+esc(evName(s))+'</span>'
      +'<span class="xc mono">'+esc(cd.txt)+'</span></div>';
  }).join("");
  return '<details class="panel" open><summary>'+esc(t().exams)
    +' <span class="mono" style="color:var(--ink-3);font-weight:400;font-size:11px">'
    + upcoming.length+"/"+list.length+'</span></summary>'
    +'<div class="panel-body"><div class="exams">'+rows+'</div></div></details>';
}

/* ── colour key ───────────────────────────────────────────────────── */
function renderLegend(){
  var rows=LEGEND.map(function(e){
    var c=COURSES[e[0]], gloss = state.lang==="th" ? e[1] : e[2];
    return '<div class="lg" style="--c:var('+c.v+')"><span class="sw"></span>'
      +'<span class="lc">'+esc(c.code)+'</span>'
      +'<span class="ln">'+esc(c[state.lang])+'<i>'+esc(gloss)+'</i></span>'
      + (c.cr?'<span class="cr">'+esc(c.cr)+'</span>':"")
      +'</div>';
  }).join("");
  var rm = state.lang==="th"
    ? "ห้อง 201 = ตึก 80 ปี · ห้อง 202 = ตึกนวัตกรรม"
    : "Room 201 = 80th Anniversary Bldg · Room 202 = Innovation Bldg";
  return '<details class="panel"><summary>'+esc(t().legend)+'</summary>'
    +'<div class="panel-body"><div class="legend">'+rows+'</div>'
    +'<p class="mono" style="margin:14px 0 0;font-size:11px;color:var(--ink-3)">'+esc(rm)+'</p>'
    +'</div></details>';
}

/* ── compose + events ─────────────────────────────────────────────── */
function render(){
  var app=document.getElementById("app");
  document.documentElement.lang = state.lang==="th" ? "th" : "en";
  if(!state.track){ app.innerHTML=renderGate(); return; }
  app.innerHTML = renderBar()+renderNext()+renderNotes()
                + renderGrid()+renderAgenda()
                + renderExams()+renderLegend()
                + '<p class="foot"><span>'+esc(t().eyebrow)+'</span><span>'+esc(t().footNote)+'</span></p>';
  /* keep the active week visible in the horizontally scrolling term ruler */
  var cur=document.querySelector('.ruler button[aria-current="true"]');
  if(cur && cur.parentNode.scrollWidth > cur.parentNode.clientWidth){
    cur.parentNode.scrollLeft = cur.offsetLeft - cur.parentNode.clientWidth/2 + cur.offsetWidth/2;
  }
}

document.addEventListener("click",function(ev){
  var el;
  if((el=ev.target.closest("[data-track]"))){
    state.track=el.getAttribute("data-track");
    store.set("ph.track",state.track);
    var c=weekOfDate(todayStr()); state.week = c<0?0:Math.min(c,WEEKS-1);
    render(); window.scrollTo(0,0); return;
  }
  if((el=ev.target.closest("[data-theme-set]"))){
    state.theme=el.getAttribute("data-theme-set");
    store.set("ph.theme",state.theme); applyTheme(); render(); return;
  }
  if((el=ev.target.closest("[data-lang]"))){
    state.lang=el.getAttribute("data-lang");
    store.set("ph.lang",state.lang); render(); return;
  }
  if((el=ev.target.closest("[data-week]"))){
    state.week=+el.getAttribute("data-week"); render(); return;
  }
  if((el=ev.target.closest("[data-nav]"))){
    var n=state.week+ +el.getAttribute("data-nav");
    if(n>=0&&n<WEEKS){ state.week=n; render(); }
    return;
  }
  if(ev.target.closest("#btn-track")){
    state.track=""; store.del("ph.track"); render(); window.scrollTo(0,0);
  }
});

document.addEventListener("keydown",function(ev){
  if(!state.track) return;
  if(ev.target.matches("input,textarea,select")) return;
  if(ev.key==="ArrowLeft"  && state.week>0)       { state.week--; render(); }
  if(ev.key==="ArrowRight" && state.week<WEEKS-1) { state.week++; render(); }
});

/* horizontal swipe between weeks */
(function(){
  var x0=null,y0=null;
  document.addEventListener("touchstart",function(e){
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  },{passive:true});
  document.addEventListener("touchend",function(e){
    if(x0===null||!state.track) return;
    var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    x0=null;
    if(Math.abs(dx)<60 || Math.abs(dx)<Math.abs(dy)*1.8) return;
    var n=state.week+(dx<0?1:-1);
    if(n>=0&&n<WEEKS){ state.week=n; render(); }
  },{passive:true});
})();

/* boot */
(function(){
  applyTheme();
  var c=weekOfDate(todayStr());
  state.week = c<0 ? 0 : Math.min(c,WEEKS-1);
  render();
})();

/* data integrity check — visible in the console, never in the UI */
(function(){
  function top(key){
    return SESSIONS.filter(function(s){ return s.c===key && s.q; })
      .reduce(function(m,s){
        var parts=String(s.q).split("-");
        return Math.max(m, parseFloat(parts[parts.length-1])||0);
      },0);
  }
  var checks=[["IDT4",75],["IDQ1_LEC",30],["IDQ1_LAB",22.5],["IDQLAB1",45],["IDG3",10]];
  var report=checks.map(function(c){
    var got=top(c[0]);
    return (got===c[1]?"ok  ":"BAD ")+c[0]+": "+got+"/"+c[1];
  });
  console.log("[schedule] session totals\n"+report.join("\n"));
  window.__scheduleCheck = function(){ return report; };
})();
</script>
